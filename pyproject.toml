[project]
name = "copenet"
version = "0.1.0"
description = "Local agent gateway: orchestrator, providers, WebSocket RPC, session and transcript storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.13.2",
    "fastapi>=0.110.0",
    "pandas>=2.2.0",
    "playwright>=1.52.0",
    "python-multipart",
    "scikit-learn>=1.9.0",
    "tiktoken>=0.12.0",
    "tvscreener==0.4.1",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "Pillow>=11.3,<13",
    "webull-openapi-python-sdk>=3.0.0,<4",
    "yfinance>=1.5.1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
sec = [
    "copetech-edgar",
]
media = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "python-multipart",
    "yt-dlp",
]

[project.scripts]
copenet = "copenet.host.main:main"
copenet-browser-demo = "copenet.browser_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copenet"]

[tool.hatch.build]
artifacts = [
    "src/copenet/host/frontend/dist/**",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["tests/integration"]

[tool.uv.sources]
copetech-edgar = { git = "https://github.com/pattty847/CopeTech-Edgar.git" }
