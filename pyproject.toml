[project]
name = "copenet"
version = "0.1.0"
description = "Local agent gateway: orchestrator, providers, WebSocket RPC, session and transcript storage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "copetech-edgar",
    "fastapi>=0.110.0",
    "pandas>=2.2.0",
    "playwright>=1.52.0",
    "python-multipart",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
    "webull-openapi-python-sdk>=2.0.12",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "pytest-asyncio>=0.24",
]
media = [
    "openai-whisper",
    "python-multipart",
    "yt-dlp",
]

[project.scripts]
copenet = "copenet.host.main:main"
copenet-browser-demo = "copenet.browser_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copenet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv.sources]
copetech-edgar = { path = "../CopeTech-Edgar", editable = true }
