[project]
name = "copenet"
version = "0.1.0"
description = "Local agent gateway: orchestrator, providers, WebSocket RPC, session and transcript storage"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
cope = "copenet.host.main:main"
copenet-host = "copenet.host.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copenet"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
